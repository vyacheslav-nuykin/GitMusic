<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GitMusic · GitHub Style</title>
    <style>
        /* ---------- GitHub Dark theme ---------- */
        :root {
            --bg-canvas: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --fg-default: #c9d1d9;
            --fg-muted: #8b949e;
            --accent: #2ea043;
            --accent-hover: #3fb950;
            --danger: #f85149;
            --transition: 0.1s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            color: var(--fg-default);
            line-height: 1.5;
            padding-bottom: 90px; /* место для фиксированного плеера */
        }

        /* контейнер */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* шапка как в GitHub */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2ea043, #58a6ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .nav a {
            color: var(--fg-muted);
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
        }
        .nav a:hover { color: var(--fg-default); }

        /* секции */
        .section {
            margin-bottom: 2.5rem;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }
        .section-header h2 {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .section-header span {
            font-size: 0.75rem;
            color: var(--fg-muted);
        }

        /* сетка карточек (как Spotify) */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
        }
        .track-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            transition: transform 0.1s, background 0.1s;
            cursor: pointer;
        }
        .track-card:hover {
            background: #21262d;
            transform: translateY(-2px);
        }
        .card-cover {
            background: #21262d;
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }
        .card-title {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-artist {
            font-size: 0.7rem;
            color: var(--fg-muted);
        }

        /* фиксированный плеер внизу (как Spotify) */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .player-track {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 180px;
        }
        .mini-cover {
            width: 48px;
            height: 48px;
            background: #21262d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .track-info {
            overflow: hidden;
        }
        .track-name {
            font-weight: 500;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 0.7rem;
            color: var(--fg-muted);
        }
        .player-controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: var(--fg-default);
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }
        .ctrl-btn:hover {
            background: #21262d;
        }
        .ctrl-btn.active {
            color: var(--accent);
        }
        .play-btn {
            background: var(--accent);
            color: #0d1117;
            width: 44px;
            height: 44px;
            font-size: 1.2rem;
        }
        .play-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }
        .progress-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 2;
            min-width: 180px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: #30363d;
            border-radius: 4px;
            cursor: pointer;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
        }
        .time {
            font-size: 0.7rem;
            font-family: 'SF Mono', monospace;
            color: var(--fg-muted);
        }
        .volume {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
        }
        input[type="range"] {
            background: #30363d;
            height: 3px;
            border-radius: 3px;
            -webkit-appearance: none;
            width: 100%;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 10px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .player-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 0.75rem;
                gap: 0.5rem;
            }
            .progress-group {
                order: 3;
            }
            .player-controls {
                justify-content: center;
            }
            .container {
                padding: 1rem;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><h1>🎵 GitMusic</h1></div>
        <div class="nav">
            <a href="#">Главная</a>
            <a href="#">Библиотека</a>
            <a href="#">Релизы</a>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>🔥 Популярные треки</h2>
            <span>обновлено из music.json</span>
        </div>
        <div class="card-grid" id="cardGrid">
            <div class="track-card">Загрузка...</div>
        </div>
    </div>
</div>

<!-- фиксированный плеер -->
<div class="player-bar" id="playerBar">
    <div class="player-track">
        <div class="mini-cover" id="miniCover">🎵</div>
        <div class="track-info">
            <div class="track-name" id="currentTrackName">—</div>
            <div class="track-artist" id="currentTrackArtist">—</div>
        </div>
    </div>
    <div class="player-controls">
        <button class="ctrl-btn" id="shuffleBtn" title="Перемешать">🔀</button>
        <button class="ctrl-btn" id="prevBtn">⏮</button>
        <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
        <button class="ctrl-btn" id="nextBtn">⏭</button>
        <button class="ctrl-btn" id="repeatBtn" title="Повтор">🔁</button>
    </div>
    <div class="progress-group">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time" id="duration">0:00</span>
    </div>
    <div class="volume">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
    </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
    // ---------- DOM элементы ----------
    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const currentTrackNameSpan = document.getElementById('currentTrackName');
    const currentTrackArtistSpan = document.getElementById('currentTrackArtist');
    const cardGrid = document.getElementById('cardGrid');
    const miniCover = document.getElementById('miniCover');

    let tracks = [];            // массив треков { name, artist, src }
    let originalTracks = [];
    let currentIndex = 0;
    let isPlaying = false;
    let shuffleOn = false;
    let repeatMode = 'none';    // 'none', 'one', 'all'

    // ---------- загрузка music.json ----------
    async function loadMusicData() {
        try {
            const res = await fetch('music.json');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!data.tracks || !data.tracks.length) throw new Error('Нет треков');
            originalTracks = data.tracks;
            resetPlaylist();
            renderCards();
            loadTrack(0);
            restoreSettings();
        } catch (err) {
            console.error(err);
            cardGrid.innerHTML = `<div class="track-card">⚠️ Ошибка: music.json не найден. Создайте файл в корне.</div>`;
        }
    }

    // перемешивание / сброс порядка
    function resetPlaylist() {
        if (shuffleOn) {
            tracks = [...originalTracks];
            for (let i = tracks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
            }
        } else {
            tracks = [...originalTracks];
        }
        // сохраняем текущий трек если возможно
        const currentSrc = tracks[currentIndex]?.src;
        if (currentSrc) {
            const newIdx = tracks.findIndex(t => t.src === currentSrc);
            if (newIdx !== -1) currentIndex = newIdx;
            else currentIndex = 0;
        } else {
            currentIndex = 0;
        }
    }

    // отрисовка карточек (сетка)
    function renderCards() {
        cardGrid.innerHTML = '';
        tracks.forEach((track, idx) => {
            const card = document.createElement('div');
            card.className = 'track-card';
            card.innerHTML = `
                <div class="card-cover">${getRandomIcon()}</div>
                <div class="card-title">${escapeHtml(track.name)}</div>
                <div class="card-artist">${escapeHtml(track.artist || '—')}</div>
            `;
            card.addEventListener('click', () => {
                currentIndex = idx;
                loadTrack(currentIndex);
                playAudio();
            });
            cardGrid.appendChild(card);
        });
    }

    function getRandomIcon() {
        const icons = ['🎸', '🎹', '🥁', '🎤', '🎧', '🎷', '🎺', '🪕', '🎵'];
        return icons[Math.floor(Math.random() * icons.length)];
    }

    // загрузка трека по индексу
    function loadTrack(index) {
        if (!tracks[index]) return;
        const t = tracks[index];
        audio.src = t.src;
        audio.load();
        currentTrackNameSpan.textContent = t.name;
        currentTrackArtistSpan.textContent = t.artist || '—';
        miniCover.textContent = getRandomIcon();
        if (isPlaying) {
            audio.play().catch(e => console.log('autoplay blocked'));
        } else {
            playPauseBtn.textContent = '▶';
        }
        updateActiveUI();
        saveCurrentTrackToLocal();
    }

    // обновить активное состояние (подсветка в карточках и кнопки)
    function updateActiveUI() {
        // подсветка карточек
        const cards = document.querySelectorAll('.track-card');
        cards.forEach((card, idx) => {
            if (idx === currentIndex) {
                card.style.border = '1px solid var(--accent)';
                card.style.background = '#21262d';
            } else {
                card.style.border = '1px solid var(--border)';
                card.style.background = 'var(--bg-card)';
            }
        });
    }

    // --- управление ---
    function playAudio() {
        audio.play().then(() => {
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        }).catch(e => console.warn(e));
    }
    function pauseAudio() {
        audio.pause();
        isPlaying = false;
        playPauseBtn.textContent = '▶';
    }
    function togglePlayPause() {
        isPlaying ? pauseAudio() : playAudio();
    }

    function nextTrack() {
        if (tracks.length === 0) return;
        if (repeatMode === 'one') {
            audio.currentTime = 0;
            audio.play();
            return;
        }
        let newIdx = currentIndex + 1;
        if (newIdx >= tracks.length) {
            if (repeatMode === 'all') newIdx = 0;
            else {
                if (isPlaying) pauseAudio();
                return;
            }
        }
        currentIndex = newIdx;
        loadTrack(currentIndex);
        if (isPlaying) playAudio();
    }

    function prevTrack() {
        if (tracks.length === 0) return;
        let newIdx = currentIndex - 1;
        if (newIdx < 0) newIdx = repeatMode === 'all' ? tracks.length - 1 : 0;
        currentIndex = newIdx;
        loadTrack(currentIndex);
        if (isPlaying) playAudio();
    }

    function toggleShuffle() {
        shuffleOn = !shuffleOn;
        resetPlaylist();
        renderCards();
        loadTrack(currentIndex);
        if (isPlaying) playAudio();
        updateShuffleUI();
        saveSettings();
    }

    function toggleRepeat() {
        if (repeatMode === 'none') repeatMode = 'all';
        else if (repeatMode === 'all') repeatMode = 'one';
        else repeatMode = 'none';
        updateRepeatUI();
        saveSettings();
    }

    function updateShuffleUI() {
        if (shuffleOn) shuffleBtn.classList.add('active');
        else shuffleBtn.classList.remove('active');
    }
    function updateRepeatUI() {
        repeatBtn.classList.remove('active');
        if (repeatMode === 'all') {
            repeatBtn.classList.add('active');
            repeatBtn.textContent = '🔁';
        } else if (repeatMode === 'one') {
            repeatBtn.classList.add('active');
            repeatBtn.textContent = '🔂';
        } else {
            repeatBtn.textContent = '🔁';
        }
    }

    // --- прогресс-бар ---
    audio.addEventListener('loadedmetadata', () => {
        if (!isNaN(audio.duration)) {
            durationSpan.textContent = formatTime(audio.duration);
        }
    });
    audio.addEventListener('timeupdate', () => {
        const cur = audio.currentTime;
        const dur = audio.duration;
        if (!isNaN(dur) && dur > 0) {
            const percent = (cur / dur) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeSpan.textContent = formatTime(cur);
        }
    });
    audio.addEventListener('ended', () => nextTrack());
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = percent * audio.duration;
    });

    // громкость
    volumeSlider.addEventListener('input', (e) => {
        audio.volume = parseFloat(e.target.value);
        saveSettings();
    });

    // --- сохранение в localStorage ---
    function saveSettings() {
        localStorage.setItem('gitmusic_volume', audio.volume);
        localStorage.setItem('gitmusic_shuffle', shuffleOn);
        localStorage.setItem('gitmusic_repeat', repeatMode);
    }
    function saveCurrentTrackToLocal() {
        localStorage.setItem('gitmusic_last_track', currentIndex);
    }
    function restoreSettings() {
        const vol = localStorage.getItem('gitmusic_volume');
        if (vol !== null) {
            audio.volume = parseFloat(vol);
            volumeSlider.value = audio.volume;
        }
        const sh = localStorage.getItem('gitmusic_shuffle');
        if (sh === 'true') {
            shuffleOn = true;
            resetPlaylist();
            renderCards();
        }
        const rep = localStorage.getItem('gitmusic_repeat');
        if (rep === 'all' || rep === 'one') repeatMode = rep;
        updateShuffleUI();
        updateRepeatUI();
        const lastTrack = parseInt(localStorage.getItem('gitmusic_last_track'));
        if (!isNaN(lastTrack) && lastTrack < tracks.length && lastTrack >= 0) {
            currentIndex = lastTrack;
            loadTrack(currentIndex);
        }
    }

    // --- helper ---
    function formatTime(sec) {
        if (isNaN(sec)) return '0:00';
        const mins = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${mins}:${s < 10 ? '0' : ''}${s}`;
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    // --- обработчики кнопок ---
    playPauseBtn.addEventListener('click', togglePlayPause);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    shuffleBtn.addEventListener('click', toggleShuffle);
    repeatBtn.addEventListener('click', toggleRepeat);

    // клавиатура
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') {
            e.preventDefault();
            togglePlayPause();
        } else if (e.code === 'ArrowLeft') {
            prevTrack();
        } else if (e.code === 'ArrowRight') {
            nextTrack();
        }
    });

    // старт
    loadMusicData();
</script>
</body>
</html>
