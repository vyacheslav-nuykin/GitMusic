<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- SEO и описание -->
    <title>GitMusic — минималистичный плеер на GitHub</title>
    <meta name="description" content="GitMusic — твой персональный музыкальный центр. Слушай свои треки с ПК и телефона бесплатно на GitHub Pages.">
    <meta name="theme-color" content="#0a0f1c">
    <meta name="color-scheme" content="dark">
    
    <!-- Apple / PWA basics (без SW, если не нужен) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Иконки (опционально, можно оставить как есть) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle fill='%235f3dc9' cx='50' cy='50' r='45'/%3E%3Cpath fill='white' d='M40 35v30l20-15-20-15z'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle fill='%235f3dc9' cx='50' cy='50' r='45'/%3E%3Cpath fill='white' d='M40 35v30l20-15-20-15z'/%3E%3C/svg%3E">
    
    <!-- Preconnect для быстрой загрузки (если есть внешние ресурсы, здесь не нужно, но для примера) -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    
    <!-- Основной CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Микроразметка Schema.org для аудио (улучшает SEO) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "MusicPlaylist",
        "name": "GitMusic Playlist",
        "description": "Пользовательский плейлист для GitMusic",
        "numTracks": "0",
        "track": []
    }
    </script>
</head>
<body>
    <div class="app">
        <!-- Хедер с ARIA -->
        <header class="header" aria-label="Шапка GitMusic">
            <h1>🎵 GitMusic</h1>
            <p class="sub" aria-label="Описание">минимализм. твои треки. везде</p>
        </header>

        <main>
            <!-- Карточка плеера с атрибутами доступности -->
            <section class="player-card" aria-label="Аудиоплеер">
                <div class="track-meta" aria-live="polite">
                    <div class="track-title" id="currentTitle" aria-label="Название трека">—</div>
                    <div class="track-artist" id="currentArtist" aria-label="Исполнитель">—</div>
                </div>

                <div class="progress-section">
                    <div class="time-group">
                        <span id="currentTime" aria-label="Текущее время">0:00</span>
                        <div class="progress-bar" id="progressBar" 
                             role="slider" 
                             aria-label="Прогресс воспроизведения" 
                             aria-valuemin="0" 
                             aria-valuemax="100" 
                             aria-valuenow="0"
                             tabindex="0">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span id="duration" aria-label="Общая длительность">0:00</span>
                    </div>
                </div>

                <!-- Кнопки управления (уже добавлены shuffle/repeat) -->
                <div class="controls" aria-label="Управление плеером">
                    <button class="ctrl-btn" id="shuffleBtn" aria-label="Перемешать" title="Перемешать">🔀</button>
                    <button class="ctrl-btn" id="prevBtn" aria-label="Предыдущий трек" title="Предыдущий">⏮</button>
                    <button class="ctrl-btn play-main" id="playPauseBtn" aria-label="Play / Pause" title="Воспроизвести / Пауза">▶</button>
                    <button class="ctrl-btn" id="nextBtn" aria-label="Следующий трек" title="Следующий">⏭</button>
                    <button class="ctrl-btn" id="repeatBtn" aria-label="Режим повтора" title="Повтор">🔁</button>
                </div>

                <div class="volume-row">
                    <span class="volume-icon" aria-hidden="true">🔊</span>
                    <input type="range" id="volumeSlider" 
                           min="0" max="1" step="0.01" value="0.7" 
                           aria-label="Громкость" 
                           title="Громкость">
                </div>
            </section>

            <!-- Список треков с ролью списка -->
            <section class="playlist-section" aria-label="Список треков">
                <h2 class="playlist-heading">🎧 плейлист</h2>
                <div class="playlist" id="playlistContainer" role="list" aria-label="Доступные треки">
                    <div class="loading-state" aria-live="polite">загрузка треков...</div>
                </div>
            </section>
        </main>

        <footer class="footer" aria-label="Подвал">
            <p>GitMusic — твоя музыка на GitHub Pages</p>
        </footer>
    </div>

    <!-- Аудиоэлемент с атрибутами -->
    <audio id="audioPlayer" preload="metadata" aria-label="Аудиоплеер" style="display: none;"></audio>

    <!-- Скрипты (defer для производительности) -->
    <script src="script.js" defer></script>
</body>
</html>
