name: Update music.json

on:
  push:
    paths: ['music/**']
  workflow_dispatch:

permissions:
  contents: write   

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true  
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build music.json
        run: |
          echo '{ "tracks": [' > music.json
          for file in music/*.mp3 music/*.ogg music/*.m4a; do
            if [ -f "$file" ]; then
              name=$(basename "$file" | sed 's/\.[^.]*$//' | sed 's/[-_]/ /g')
              echo "    { \"name\": \"$name\", \"artist\": \"\", \"src\": \"$file\" }," >> music.json
            fi
          done
          sed -i '$ s/,$//' music.json
          echo '  ] }' >> music.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add music.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update music.json"
          git push
